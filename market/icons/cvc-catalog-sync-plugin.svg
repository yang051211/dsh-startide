<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Three features of the plugin: catalog, coefficient and balance">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16202e"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="640" height="300" fill="url(#bg)"/>
  <rect x="1" y="1" width="638" height="298" rx="18" fill="none" stroke="#2b3a4d" stroke-width="2"/>

  <!-- левая панель: каталог -->
  <g>
    <rect x="36" y="58" width="160" height="184" rx="14" fill="#111827" stroke="#2b3a4d" stroke-width="2"/>
    <rect x="54" y="78" width="124" height="10" rx="5" fill="#3b82f6"/>
    <rect x="54" y="100" width="96" height="8" rx="4" fill="#334155"/>
    <rect x="54" y="118" width="110" height="8" rx="4" fill="#334155"/>
    <rect x="54" y="136" width="84" height="8" rx="4" fill="#334155"/>
    <rect x="54" y="154" width="102" height="8" rx="4" fill="#334155"/>
    <rect x="54" y="172" width="70" height="8" rx="4" fill="#334155"/>
    <g stroke="#60a5fa" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M132 196a20 20 0 0 1 20 8"/>
      <path d="M152 192v12h-12"/>
    </g>
    <rect x="54" y="212" width="52" height="8" rx="4" fill="#1d4ed8"/>
  </g>

  <!-- средняя панель: коэффициент -->
  <g>
    <rect x="240" y="58" width="160" height="184" rx="14" fill="#111827" stroke="#2b3a4d" stroke-width="2"/>
    <g stroke="#94a3b8" stroke-width="8" stroke-linecap="round">
      <path d="M284 92 356 152"/>
      <path d="M288 148 354 94"/>
    </g>
    <circle cx="284" cy="92" r="7" fill="#94a3b8"/>
    <circle cx="360" cy="92" r="7" fill="#94a3b8"/>
    <circle cx="284" cy="152" r="7" fill="#94a3b8"/>
    <circle cx="360" cy="152" r="7" fill="#94a3b8"/>
    <rect x="268" y="186" width="104" height="30" rx="8" fill="#1f3a2e" stroke="#34d399" stroke-width="2"/>
    <path d="M292 195l10 12M302 195l-10 12" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <rect x="318" y="197" width="38" height="8" rx="4" fill="#34d399"/>
  </g>

  <!-- правая панель: баланс -->
  <g>
    <rect x="444" y="58" width="160" height="184" rx="14" fill="#111827" stroke="#2b3a4d" stroke-width="2"/>
    <path d="M524 84v54" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <path d="M486 138h76" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <path d="M470 138a54 54 0 0 1 54-54 54 54 0 0 1 54 54" stroke="#334155" stroke-width="6" stroke-linecap="round" fill="none"/>
    <g>
      <path d="M452 138h68" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/>
      <path d="M452 138a34 34 0 0 1 68 0" fill="none" stroke="#60a5fa" stroke-width="3" opacity="0.35"/>
      <circle cx="486" cy="170" r="20" fill="none" stroke="#60a5fa" stroke-width="3"/>
    </g>
    <circle cx="524" cy="212" r="9" fill="#3fb950"/>
    <rect x="544" y="207" width="44" height="10" rx="5" fill="#334155"/>
  </g>

  <!-- линия-связка -->
  <path d="M200 150h32M404 150h32" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M232 150h-8M404 150h8" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>

  <!-- верхняя полоса: три переключателя -->
  <g>
    <rect x="36" y="24" width="52" height="18" rx="9" fill="#2563eb"/>
    <circle cx="80" cy="33" r="6" fill="#e5e7eb"/>
    <rect x="240" y="24" width="52" height="18" rx="9" fill="#2563eb"/>
    <circle cx="284" cy="33" r="6" fill="#e5e7eb"/>
    <rect x="444" y="24" width="52" height="18" rx="9" fill="#2563eb"/>
    <circle cx="488" cy="33" r="6" fill="#e5e7eb"/>
  </g>
</svg>