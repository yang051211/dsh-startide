<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Everwith">
  <defs>
    <linearGradient id="ev-bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2a3046"/>
      <stop offset="1" stop-color="#151925"/>
    </linearGradient>
    <!-- 大个子:暖黄 -->
    <linearGradient id="ev-a" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffd88c"/>
      <stop offset="1" stop-color="#ffae62"/>
    </linearGradient>
    <!-- 小个子:粉 -->
    <linearGradient id="ev-b" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ff9db9"/>
      <stop offset="1" stop-color="#e2688f"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="92" height="92" rx="22" fill="url(#ev-bg)"/>

  <!-- 左边:大一点的那个,肩在 x 20~52 -->
  <circle cx="36" cy="37" r="9.6" fill="url(#ev-a)"/>
  <path d="M20 74c0-9.4 7.2-15.6 16-15.6S52 64.6 52 74z" fill="url(#ev-a)"/>

  <!-- 右边:小一点的那个,稍稍靠后、靠在肩上 -->
  <circle cx="63" cy="42" r="8.2" fill="url(#ev-b)"/>
  <path d="M50 74c0-8 6-13.2 13-13.2S76 66 76 74z" fill="url(#ev-b)"/>
</svg>
