<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="User Skill Bridge">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="22" fill="url(#bg)"/>
  <!-- slash: the human /command gesture -->
  <path d="M44 24 L34 50" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
  <!-- bridge deck -->
  <path d="M14 62 H82" stroke="url(#deck)" stroke-width="6" stroke-linecap="round"/>
  <!-- bridge arch -->
  <path d="M20 62 C30 44 66 44 76 62" stroke="url(#deck)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- piers -->
  <path d="M30 62 V74 M48 62 V78 M66 62 V74" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <!-- spark: the model now crossing the bridge -->
  <circle cx="70" cy="32" r="5" fill="#fbbf24"/>
</svg>
