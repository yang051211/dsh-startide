<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30" height="30" fill="none" role="img" aria-label="图像生成工坊">
  <!-- 图像生成工坊（dsh-imagekit）
       24 网格 / 统一描边 1.7（比图标库默认 2 细一档，线条更精致）/ round cap
       元素：画框 + 远山 + 右坡（Tabler `photo-up` 原坐标）
             + 左上太阳点（照片）
             + 右上主火花 + 角落小火花（AI 生成，成组出现）
             + 右下向上箭头（放大）
       冷色对角渐变 #38BDF8 → #5B5BF0；零模糊、零投影、透明底。 -->
  <defs>
    <linearGradient id="ik-g" gradientUnits="userSpaceOnUse" x1="3" y1="3" x2="21" y2="21">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#5B5BF0"/>
    </linearGradient>
  </defs>

  <g stroke="url(#ik-g)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M12.5 21H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v6.5"/>
    <path d="m3 16 5-5c.928-.893 2.072-.893 3 0l3.5 3.5"/>
    <path d="m14 14 1-1c.679-.653 1.473-.829 2.214-.526"/>
    <path d="M19 22v-6m3 3-3-3-3 3"/>
  </g>

  <!-- 太阳（照片） -->
  <circle cx="6.6" cy="7.3" r="1.15" fill="url(#ik-g)"/>

  <!-- 生成火花（主 + 次） -->
  <path d="M14.4 5.8Q14.4 7.2 16.4 7.8Q15.0 7.8 14.4 9.8Q14.4 8.4 12.4 7.8Q13.8 7.8 14.4 5.8Z" fill="url(#ik-g)"/>
  <path d="M18.2 4.1000000000000005Q18.2 4.66 19.0 4.9Q18.439999999999998 4.9 18.2 5.7Q18.2 5.140000000000001 17.4 4.9Q17.96 4.9 18.2 4.1000000000000005Z" fill="url(#ik-g)"/>
</svg>
