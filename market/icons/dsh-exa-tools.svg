<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Original mark: a search lens over a small neural motif (three linked
       nodes), the two capabilities of the plugin — find pages, read them.
       No tile or background: Plugin Manager draws the surrounding tile.
       The lens interior stays genuinely transparent in both themes.
       Palette follows the installed plugin family's restrained blue. -->
  <defs>
    <linearGradient id="exa_tools_ring" x1="15" y1="6.5" x2="15" y2="23.5" gradientUnits="userSpaceOnUse">
      <stop stop-color="#69B9FF" />
      <stop offset="1" stop-color="#324DE2" />
    </linearGradient>
  </defs>
  <!-- handle -->
  <path d="M21.2 21.2L28.6 28.6" stroke="url(#exa_tools_ring)" stroke-width="3" stroke-linecap="round" />
  <!-- lens ring -->
  <circle cx="15" cy="15" r="8.5" stroke="url(#exa_tools_ring)" stroke-width="2.5" />
  <!-- neural motif inside the lens -->
  <g stroke="#69B9FF" stroke-width="1.2" stroke-linecap="round">
    <path d="M11.8 13.2L17.8 12.2" />
    <path d="M11.8 13.2L15.2 18.4" />
    <path d="M17.8 12.2L15.2 18.4" />
  </g>
  <g fill="#69B9FF">
    <circle cx="11.8" cy="13.2" r="1.5" />
    <circle cx="17.8" cy="12.2" r="1.5" />
    <circle cx="15.2" cy="18.4" r="1.5" />
  </g>
</svg>
