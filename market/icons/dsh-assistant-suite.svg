<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DSH Assistant Suite — Usage and Reminders">
  <defs>
    <linearGradient id="bg-squircle" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="52%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <radialGradient id="ambient-glow" cx="22" cy="18" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.34"/>
      <stop offset="60%" stop-color="#30D158" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="squircle-rim" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="glass-card" x1="12" y1="13" x2="46" y2="51" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="glass-border" x1="12" y1="13" x2="46" y2="51" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="bar-blue" x1="0" y1="24" x2="0" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64D2FF"/>
      <stop offset="100%" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="bar-cyan" x1="0" y1="20" x2="0" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#32ADE6"/>
    </linearGradient>
    <linearGradient id="bar-green" x1="0" y1="17" x2="0" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#63E6BE"/>
      <stop offset="100%" stop-color="#30D158"/>
    </linearGradient>
    <linearGradient id="bell-badge" x1="35" y1="10" x2="55" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD60A"/>
      <stop offset="48%" stop-color="#FF9F0A"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
    <filter id="card-shadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <!-- Apple macOS / iOS Squircle App Tile -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg-squircle)"/>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#ambient-glow)"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="13.5" fill="none" stroke="url(#squircle-rim)" stroke-width="1"/>

  <!-- Frosted Glass Usage Widget Card -->
  <g filter="url(#card-shadow)">
    <rect x="11" y="15" width="36" height="37" rx="9" fill="url(#glass-card)" stroke="url(#glass-border)" stroke-width="1"/>
  </g>

  <!-- Header Status Dot & Meter Line inside Widget -->
  <circle cx="17.5" cy="21.5" r="2" fill="#30D158"/>
  <rect x="22" y="20.25" width="14" height="2.5" rx="1.25" fill="#FFFFFF" fill-opacity="0.35"/>

  <!-- Apple Activity / Usage Capsule Bars -->
  <rect x="16" y="34" width="5" height="12" rx="2.5" fill="url(#bar-blue)"/>
  <rect x="23.5" y="28" width="5" height="18" rx="2.5" fill="url(#bar-cyan)"/>
  <rect x="31" y="31" width="5" height="15" rx="2.5" fill="url(#bar-blue)"/>
  <rect x="38.5" y="25" width="5" height="21" rx="2.5" fill="url(#bar-green)"/>

  <!-- Trend Sparkline Overlay -->
  <path d="M18.5 31.5 L26 26 L33.5 28.5 L41 22.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating Apple Notification Bell Badge -->
  <g filter="url(#card-shadow)">
    <circle cx="45" cy="20" r="11" fill="url(#bell-badge)"/>
    <circle cx="45" cy="20" r="10.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>
    <!-- Crisp White Bell Silhouette -->
    <path d="M45 13.4c-.65 0-1.18.5-1.22 1.14-2.18.47-3.58 2.34-3.58 4.66v2.25l-1.32 1.66a.75.75 0 0 0 .59 1.22h11.06a.75.75 0 0 0 .59-1.22L49.8 21.45V19.2c0-2.32-1.4-4.19-3.58-4.66A1.22 1.22 0 0 0 45 13.4Zm-1.75 12.15a1.75 1.75 0 0 0 3.5 0h-3.5Z" fill="#FFFFFF"/>
  </g>
</svg>
