<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="dsh-space-ptt">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4D6BFE"/>
      <stop offset="1" stop-color="#2A3FD0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D8E2FF"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- spacebar -->
  <rect x="16" y="82" width="96" height="22" rx="11" fill="url(#bar)" opacity="0.95"/>
  <rect x="26" y="92" width="76" height="3" rx="1.5" fill="#2A3FD0" opacity="0.35"/>
  <!-- hold indicator: dot on the bar -->
  <circle cx="64" cy="100" r="2.6" fill="#4D6BFE"/>
  <!-- waveform (voice) -->
  <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="40" y1="44" x2="40" y2="60"/>
    <line x1="52" y1="34" x2="52" y2="70"/>
    <line x1="64" y1="26" x2="64" y2="78"/>
    <line x1="76" y1="34" x2="76" y2="70"/>
    <line x1="88" y1="44" x2="88" y2="60"/>
  </g>
</svg>
