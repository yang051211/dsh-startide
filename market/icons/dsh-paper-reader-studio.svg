<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Paper Reader">
  <defs>
    <linearGradient id="pr-page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8eef7"/>
    </linearGradient>
    <linearGradient id="pr-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#247bbf"/>
      <stop offset="1" stop-color="#5b3fd6"/>
    </linearGradient>
  </defs>
  <!-- page -->
  <path d="M14 8h26l10 10v38a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4V12a4 4 0 0 1 4-4z"
        fill="url(#pr-page)" stroke="#1f2d3d" stroke-opacity=".35" stroke-width="2"/>
  <!-- folded corner -->
  <path d="M40 8l10 10H44a4 4 0 0 1-4-4z" fill="#c9d6e6" stroke="#1f2d3d" stroke-opacity=".25" stroke-width="1.5"/>
  <!-- text lines -->
  <g fill="#8b9bb0">
    <rect x="20" y="24" width="24" height="3" rx="1.5"/>
    <rect x="20" y="32" width="20" height="3" rx="1.5"/>
    <rect x="20" y="40" width="22" height="3" rx="1.5"/>
  </g>
  <!-- math accent: sigma on a highlighted band -->
  <rect x="17" y="48" width="30" height="6" rx="3" fill="url(#pr-accent)" opacity=".22"/>
  <text x="32" y="53.6" font-family="Cambria Math, Georgia, serif" font-size="9" font-weight="700"
        text-anchor="middle" fill="url(#pr-accent)">&#8721;x</text>
</svg>
