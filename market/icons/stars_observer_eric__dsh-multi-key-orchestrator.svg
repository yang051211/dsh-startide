    <ellipse cx="13" cy="50.5" rx="5.6" ry="4.2" transform="rotate(-22 13 50.5)"/>
    <ellipse cx="25" cy="45.5" rx="5.6" ry="4.2" transform="rotate(-22 25 45.5)"/>
    <ellipse cx="37" cy="40.5" rx="5.6" ry="4.2" transform="rotate(-22 37 40.5)"/>
    <ellipse cx="49" cy="35.5" rx="5.6" ry="4.2" transform="rotate(-22 49 35.5)"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
    <path d="M18.4 48.6V16.2"/>
    <path d="M30.4 43.6V13.4"/>
    <path d="M42.4 38.6V12.2"/>
    <path d="M54.4 33.6V11"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round">
    <path d="M18.4 16.2C27 9.4 45 8.2 54.4 11"/>
    <path d="M18.4 26.4C27 19.6 45 18.4 54.4 21.2"/>
