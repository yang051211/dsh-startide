<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">SSH cloud servers</title>
  <defs>
    <linearGradient id="bg" x1="8" y1="6" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="key" x1="20" y1="18" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- 钥匙头：外环 + 中心孔 -->
  <circle cx="24" cy="24" r="10.5" fill="none" stroke="url(#key)" stroke-width="4.6"/>
  <circle cx="24" cy="24" r="3.4" fill="#a5f3fc"/>

  <!-- 钥匙柄 -->
  <path d="M31.6 31.6 47 47" stroke="url(#key)" stroke-width="4.6" stroke-linecap="round"/>

  <!-- 柄上的两道齿 -->
  <path d="M38.5 38.5 43.2 33.8" stroke="url(#key)" stroke-width="4" stroke-linecap="round"/>
  <path d="M44 44 48.7 39.3" stroke="url(#key)" stroke-width="4" stroke-linecap="round"/>
</svg>
