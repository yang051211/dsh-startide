<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- NVIDIA green background -->
  <rect width="64" height="64" rx="12" fill="#76B900"/>
  <!-- White cube/symbol -->
  <g transform="translate(16, 12)">
    <!-- Front face -->
    <path d="M0 0 L32 0 L32 32 L0 32 Z" fill="white" opacity="0.9"/>
    <!-- Top face -->
    <path d="M0 0 L16 -16 L48 -16 L32 0 Z" fill="white" opacity="0.7"/>
    <!-- Right face -->
    <path d="M32 0 L48 -16 L48 16 L32 32 Z" fill="white" opacity="0.5"/>
    <!-- Green accent lines on cube -->
    <path d="M8 8 L24 8" stroke="#76B900" stroke-width="2" stroke-linecap="round"/>
    <path d="M8 16 L24 16" stroke="#76B900" stroke-width="2" stroke-linecap="round"/>
    <path d="M8 24 L24 24" stroke="#76B900" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>