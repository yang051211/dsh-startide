<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Context Slimmer">
  <!-- Original artwork: a context window whose stale tool-result pages are being
       swept out of the stack, leaving a compact, readable surface behind. -->
  <defs>
    <linearGradient id="cs-tile" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0A18"/>
      <stop offset="0.55" stop-color="#16132E"/>
      <stop offset="1" stop-color="#2A2358"/>
    </linearGradient>
    <linearGradient id="cs-page" x1="18" y1="14" x2="40" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8E6BFF"/>
      <stop offset="1" stop-color="#4EC9FF"/>
    </linearGradient>
    <linearGradient id="cs-sweep" x1="34" y1="18" x2="52" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EE6C8"/>
      <stop offset="1" stop-color="#8E6BFF"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#cs-tile)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="14.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <!-- The retained surface: one compact page. -->
  <rect x="16" y="15" width="17" height="34" rx="3.5" fill="url(#cs-page)" fill-opacity="0.92"/>
  <rect x="20" y="20" width="9" height="2.2" rx="1.1" fill="#0B0A18" fill-opacity="0.55"/>
  <rect x="20" y="25" width="9" height="2.2" rx="1.1" fill="#0B0A18" fill-opacity="0.55"/>
  <rect x="20" y="30" width="6" height="2.2" rx="1.1" fill="#0B0A18" fill-opacity="0.55"/>
  <!-- The stale pages leaving the window. -->
  <g opacity="0.85">
    <rect x="38" y="18" width="11" height="15" rx="2.5" fill="#FFFFFF" fill-opacity="0.16" transform="rotate(14 43.5 25.5)"/>
    <rect x="42" y="28" width="10" height="13" rx="2.5" fill="#FFFFFF" fill-opacity="0.10" transform="rotate(26 47 34.5)"/>
    <rect x="34" y="39" width="12" height="2.4" rx="1.2" fill="#FFFFFF" fill-opacity="0.16"/>
  </g>
  <!-- Sweep stroke: selectivity, not blind truncation. -->
  <path d="M35 47c6-2 11-7 14-14" fill="none" stroke="url(#cs-sweep)" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="35" cy="47" r="2.6" fill="#5EE6C8"/>
</svg>
