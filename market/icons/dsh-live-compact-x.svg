<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="dsh-live-compact-x">
  <title>dsh-live-compact-x</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18263F"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7CC0FF"/>
      <stop offset="0.55" stop-color="#4D8BFF"/>
      <stop offset="1" stop-color="#2F5BFF"/>
    </linearGradient>
  </defs>
  <!-- 底：深色圆角方，深色主题和浅色主题下都不糊 -->
  <rect x="1" y="1" width="46" height="46" rx="12" fill="url(#bg)"/>
  <rect x="1.6" y="1.6" width="44.8" height="44.8" rx="11.4" fill="none" stroke="#2A4A78" stroke-width="1.3"/>
  <!-- 要被压掉的两段尾巴 -->
  <rect x="11" y="10.5" width="26" height="3.4" rx="1.7" fill="#6E92C2"/>
  <rect x="15" y="18" width="18" height="3.4" rx="1.7" fill="#A0C2E9"/>
  <!-- 往下压的箭头 -->
  <path d="M18 24.8 L24 30.2 L30 24.8" fill="none" stroke="#BBD8FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 压完之后留下的一根亮线 -->
  <rect x="10.5" y="35" width="27" height="4.8" rx="2.4" fill="url(#hot)"/>
</svg>
