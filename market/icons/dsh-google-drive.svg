<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Google Drive">
  <title>Google Drive</title>
  <!--
    A file being pulled down into a chat bubble, which is what the plugin
    does: drag a Drive file into the conversation. It reads as "files you can
    reach" rather than reusing any vendor's product mark, so the bundle stays
    under a permissive licence.
  -->
  <defs>
    <linearGradient id="gd-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#091c36"/>
      <stop offset="1" stop-color="#05121f"/>
    </linearGradient>
    <linearGradient id="gd-file" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#57ebee"/>
      <stop offset="1" stop-color="#4ac8ca"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#gd-plate)"/>

  <!-- the file, with a folded corner -->
  <path d="M18 9h13l8 8v11a3 3 0 0 1-3 3H18a3 3 0 0 1-3-3V12a3 3 0 0 1 3-3Z" fill="url(#gd-file)"/>
  <path d="M31 9v6a2 2 0 0 0 2 2h6Z" fill="#091c36" opacity="0.45"/>

  <!-- the pull, from the file down into the chat -->
  <path d="M28 31v6" fill="none" stroke="#57ebee" stroke-width="4" stroke-linecap="round"/>
  <path d="M28 42l-5-7h10Z" fill="#57ebee"/>

  <!-- the chat bubble it lands in -->
  <path d="M8 44h20a5 5 0 0 1 5 5v3a5 5 0 0 1-5 5H17l-5 4v-4h-4a5 5 0 0 1-5-5v-3a5 5 0 0 1 5-5Z" fill="#ffffff"/>

  <!-- monogram -->
  <rect x="37" y="40" width="23" height="17" rx="6" fill="#091c36" stroke="#57ebee" stroke-width="2"/>
  <text x="48.5" y="52.5" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">GD</text>
</svg>
