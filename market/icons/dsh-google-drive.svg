<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="64" height="64" role="img" aria-label="Google Drive accounts">
  <title>Google Drive accounts</title>
  <!--
    Original artwork: an open storage tray holding a key. It reads as
    "cloud credentials" rather than reusing any vendor's product mark, so the
    bundle can ship under a permissive licence.
  -->
  <defs>
    <linearGradient id="gd-tray" x1="3" y1="13" x2="21" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3D7DF6"/>
      <stop offset="1" stop-color="#2A5BC4"/>
    </linearGradient>
    <linearGradient id="gd-key" x1="8" y1="4" x2="16" y2="11" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6FA8FF"/>
      <stop offset="1" stop-color="#4C86F0"/>
    </linearGradient>
  </defs>
  <path fill="url(#gd-key)" d="M12 3.2a4.1 4.1 0 0 0-2.05 7.66v1.28h4.1v-1.28A4.1 4.1 0 0 0 12 3.2Zm-1.6 4.1a1.6 1.6 0 1 1 3.2 0 1.6 1.6 0 0 1-3.2 0Z"/>
  <path fill="#FFFFFF" d="M9.6 12.9h4.8v2.1H9.6z"/>
  <path fill="url(#gd-tray)" d="M2.6 15.1a1.2 1.2 0 0 1 1.2-1.2h4.05l1.7 2.3h9.65a1.2 1.2 0 0 1 1.2 1.2v4.3a1.2 1.2 0 0 1-1.2 1.2H3.8a1.2 1.2 0 0 1-1.2-1.2v-4.3Z"/>
</svg>
