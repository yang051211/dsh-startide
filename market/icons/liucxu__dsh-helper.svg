<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">DSH Helper</title>
  <desc id="desc">A silver H with a rising blue bridge and an amber notification dot on a midnight tile. Usage, cost, and reminders for DeepSeek Harness.</desc>
  <defs>
    <linearGradient id="tile" x1="24" y1="16" x2="232" y2="248" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202B40"/><stop offset="1" stop-color="#0A101D"/>
    </linearGradient>
    <linearGradient id="rim" x1="40" y1="16" x2="208" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".28"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".06"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="silver" x1="80" y1="68" x2="176" y2="188" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#AEBFD8"/>
    </linearGradient>
    <linearGradient id="bridge" x1="92" y1="144" x2="164" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#638DFF"/><stop offset="1" stop-color="#9EDFFF"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#tile)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="57.5" fill="none" stroke="url(#rim)"/>
  <path d="M80 80V176M176 80V176" fill="none" stroke="url(#silver)" stroke-width="24" stroke-linecap="round"/>
  <path d="M92 144L164 112" fill="none" stroke="url(#bridge)" stroke-width="24" stroke-linecap="round"/>
  <circle cx="196" cy="60" r="12" fill="#E8BA78" stroke="#111A2A" stroke-width="6"/>
</svg>
