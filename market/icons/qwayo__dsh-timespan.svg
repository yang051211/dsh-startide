<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="dsh-timespan">
  <style>
    :root {
      --icon-bg: #f4f5f7;
      --ring-high: #1f4e94;
      --ring-low: #79b3f9;
      --ring-task: #7a5aa6;
      --hand: #133463;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --icon-bg: #242729;
        --ring-high: #79b3f9;
        --ring-low: #3f6ba8;
        --ring-task: #c29be8;
        --hand: #ffffff;
