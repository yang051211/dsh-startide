  <rect width="64" height="64" rx="16" fill="var(--icon-bg)"/>
  <path d="M11.46 27.63 A21 21 0 0 1 52.54 27.63" fill="none" stroke="var(--ring-high)" stroke-width="5" stroke-linecap="round"/>
  <path d="M52.54 36.37 A21 21 0 0 1 36.37 52.54" fill="none" stroke="var(--ring-task)" stroke-width="5" stroke-linecap="round"/>
  <path d="M27.63 52.54 A21 21 0 0 1 11.46 36.37" fill="none" stroke="var(--ring-low)" stroke-width="5" stroke-linecap="round"/>
  <path d="M32 32 43 21" fill="none" stroke="var(--hand)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="4" fill="var(--hand)"/>
