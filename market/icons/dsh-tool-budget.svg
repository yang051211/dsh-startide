    <line x1="16" y1="21" x2="48" y2="21" opacity=".55"/>
    <circle cx="40" cy="21" r="5"/>
    <line x1="16" y1="32" x2="48" y2="32" opacity=".55"/>
    <circle cx="24" cy="32" r="5"/>
    <line x1="16" y1="43" x2="48" y2="43" opacity=".55"/>
    <circle cx="34" cy="43" r="5"/>
  </g>
