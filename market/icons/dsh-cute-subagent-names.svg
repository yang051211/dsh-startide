<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Cute subagent names">
  <title>Cute subagent names</title>
  <!-- soft pink plate -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#ff8fb1" opacity="0.14"/>
  <rect x="4" y="4" width="56" height="56" rx="16" fill="none" stroke="#ff6f9c" stroke-width="2.5" opacity="0.9"/>
  <!-- head -->
  <circle cx="32" cy="35" r="14.5" fill="#ff6f9c" opacity="0.16"/>
  <circle cx="32" cy="35" r="14.5" fill="none" stroke="#ff5c8d" stroke-width="2.2"/>
  <!-- cat ears -->
  <path d="M21.5 24.5 L19.5 14 L29 20.5 Z" fill="none" stroke="#ff5c8d" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M42.5 24.5 L44.5 14 L35 20.5 Z" fill="none" stroke="#ff5c8d" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- eyes -->
  <circle cx="26.5" cy="33" r="2.1" fill="#e0447a"/>
  <circle cx="37.5" cy="33" r="2.1" fill="#e0447a"/>
  <!-- blush -->
  <ellipse cx="22.5" cy="39.5" rx="2.8" ry="1.7" fill="#ff9dbb" opacity="0.85"/>
  <ellipse cx="41.5" cy="39.5" rx="2.8" ry="1.7" fill="#ff9dbb" opacity="0.85"/>
  <!-- smile -->
  <path d="M28.6 40.6 Q32 43.6 35.4 40.6" fill="none" stroke="#e0447a" stroke-width="1.9" stroke-linecap="round"/>
  <!-- sparkle: the "cute name" accent -->
  <path d="M48 20 L49.2 23 L52.2 24.2 L49.2 25.4 L48 28.4 L46.8 25.4 L43.8 24.2 L46.8 23 Z" fill="#ffb3c9"/>
</svg>
