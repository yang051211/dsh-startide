<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Lightweight memory">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C8DFF"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#g)"/>
  <!-- 三条记忆痕迹，自上而下逐条变淡，表示衰减 -->
  <rect x="16" y="18" width="26" height="4.5" rx="2.25" fill="#fff" opacity="0.95"/>
  <rect x="16" y="29" width="32" height="4.5" rx="2.25" fill="#fff" opacity="0.62"/>
  <rect x="16" y="40" width="18" height="4.5" rx="2.25" fill="#fff" opacity="0.34"/>
  <!-- 右侧钩形，表示已验证 -->
  <path d="M41 43.5l4.2 4.2 7.3-8.4" fill="none" stroke="#fff" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
</svg>