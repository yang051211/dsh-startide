<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- halo of the lit conductor node -->
  <circle cx="32" cy="14" r="10.5" stroke="#4f8cff" stroke-opacity="0.22" stroke-width="2"/>
  <circle cx="32" cy="14" r="7.5" stroke="#4f8cff" stroke-opacity="0.45" stroke-width="2"/>
  <!-- lit central node (the conductor) -->
  <circle cx="32" cy="14" r="4.5" fill="#4f8cff"/>
  <!-- three branches -->
  <path d="M32 20.5 L32 30" stroke="#e6e9ef" stroke-width="2" stroke-linecap="round"/>
  <path d="M32 30 L17 45.5" stroke="#e6e9ef" stroke-width="2" stroke-linecap="round"/>
  <path d="M32 30 L47 45.5" stroke="#e6e9ef" stroke-width="2" stroke-linecap="round"/>
  <path d="M32 30 L32 48" stroke="#e6e9ef" stroke-width="2" stroke-linecap="round"/>
  <!-- branch-end role nodes -->
  <circle cx="17" cy="48.5" r="3.5" stroke="#e6e9ef" stroke-width="2"/>
  <circle cx="47" cy="48.5" r="3.5" stroke="#e6e9ef" stroke-width="2"/>
  <circle cx="32" cy="51.5" r="3.5" stroke="#e6e9ef" stroke-width="2"/>
</svg>
