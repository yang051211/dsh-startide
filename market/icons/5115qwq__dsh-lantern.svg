<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="LANtern">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd76e"/>
      <stop offset="55%" stop-color="#ff9f43"/>
      <stop offset="100%" stop-color="#e8590c"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#ffd76e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffd76e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 光晕 -->
  <circle cx="128" cy="132" r="104" fill="url(#halo)"/>

  <!-- 提梁 -->
  <path d="M108 44c0-11 9-20 20-20s20 9 20 20" fill="none" stroke="#8d99ae" stroke-width="7" stroke-linecap="round"/>
  <rect x="106" y="42" width="44" height="9" rx="4.5" fill="#8d99ae"/>

  <!-- 灯笼主体 -->
  <rect x="64" y="56" width="128" height="14" rx="7" fill="#495057"/>
  <rect x="64" y="186" width="128" height="14" rx="7" fill="#495057"/>

  <path d="M72 70h112c0 38-10 70-22 90-8 14-20 26-34 26s-26-12-34-26c-12-20-22-52-22-90z"
        fill="url(#glow)"/>

  <!-- 骨架线（灯笼的竹条） -->
  <g stroke="#e8590c" stroke-opacity="0.34" stroke-width="2.5" fill="none">
    <path d="M96 70c-4 40-2 78 6 116"/>
    <path d="M128 70v116"/>
    <path d="M160 70c4 40 2 78-6 116"/>
  </g>

  <!-- 网络节点（三点 + 连线，暗示 LAN） -->
  <g fill="#1c7ed6">
    <circle cx="128" cy="122" r="7"/>
    <circle cx="103" cy="150" r="5.5"/>
    <circle cx="153" cy="150" r="5.5"/>
  </g>
  <g stroke="#1c7ed6" stroke-width="2.5" stroke-opacity="0.9" stroke-linecap="round">
    <path d="M122 128l-16 18"/>
    <path d="M134 128l16 18"/>
    <path d="M109 152h35"/>
  </g>

  <!-- 流苏 -->
  <path d="M128 200v26" stroke="#495057" stroke-width="5" stroke-linecap="round"/>
  <path d="M116 232h24" stroke="#495057" stroke-width="4" stroke-linecap="round"/>
</svg>