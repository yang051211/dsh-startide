<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DSH Desktop Alert Card">
  <!-- 桌面提示卡：一张圆角卡片 + 右上角提示点，表达「任务跑完来提醒」 -->
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A2E3A"/>
      <stop offset="100%" stop-color="#15171D"/>
    </linearGradient>
  </defs>
  <rect x="6" y="16" width="52" height="34" rx="8" fill="url(#card)" stroke="#4C8DFF" stroke-width="2"/>
  <rect x="6" y="16" width="5" height="34" rx="2.5" fill="#4C8DFF"/>
  <rect x="17" y="25" width="26" height="4" rx="2" fill="#E8ECF4"/>
  <rect x="17" y="33" width="34" height="3" rx="1.5" fill="#8A93A6"/>
  <rect x="17" y="39" width="22" height="3" rx="1.5" fill="#8A93A6"/>
  <circle cx="50" cy="14" r="8" fill="#FFBA42"/>
  <path d="M50 9.5v5.2l3.2 2" fill="none" stroke="#15171D" stroke-width="2" stroke-linecap="round"/>
</svg>
