<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Quiet windows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- the user's screen -->
  <rect x="18" y="34" width="62" height="46" rx="6" fill="none" stroke="#6b7a90" stroke-width="4"/>
  <path d="M46 92h14M53 80v12" stroke="#6b7a90" stroke-width="4" stroke-linecap="round"/>
  <path d="M28 46h42" stroke="#3d4b60" stroke-width="4" stroke-linecap="round"/>
  <!-- the window that lives outside the screen -->
  <rect x="76" y="22" width="40" height="30" rx="5" fill="#111827" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6 5"/>
  <path d="M84 32h18" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M84 40h11" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
  <!-- off-screen direction -->
  <path d="M70 58l14-14" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 4" opacity="0.8"/>
</svg>
