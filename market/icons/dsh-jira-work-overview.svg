<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Jira work overview">
  <!--
    Three work-item rows, each a status dot plus its bar. The first dot is
    solid and the second is hollow so the stack reads as "items at different
    workflow states" rather than as a plain list; the third is solid again.
    Transparent canvas, no background plate, colours fixed because the host
    paints this as an image.
  -->
  <circle cx="12" cy="11" r="2.6" fill="#4D6BFE"/>
  <path d="M17.5 11 H27" stroke="#93A5FF" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="12" cy="18" r="1.9" stroke="#93A5FF" stroke-width="1.9"/>
  <path d="M17.5 18 H24" stroke="#93A5FF" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="12" cy="25" r="2.6" fill="#4D6BFE"/>
  <path d="M17.5 25 H21" stroke="#93A5FF" stroke-width="2.8" stroke-linecap="round"/>
</svg>
