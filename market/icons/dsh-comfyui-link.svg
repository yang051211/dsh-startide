<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ComfyUI Bridge">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2440" />
      <stop offset="1" stop-color="#2c1c3f" />
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5be0d0" />
      <stop offset="1" stop-color="#b98cff" />
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ce8dc" />
      <stop offset="1" stop-color="#5cb8ff" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#bg)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#ffffff" stroke-opacity="0.09" />

  <!-- 连线：两个输入节点汇到一个输出节点 -->
  <path d="M22.5 20.5 C 30 20.5, 30 32, 37.5 32" fill="none" stroke="url(#wire)" stroke-width="2.4" stroke-linecap="round" />
  <path d="M22.5 44 C 30 44, 30 32, 37.5 32" fill="none" stroke="url(#wire)" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.65" />

  <!-- 输入节点 -->
  <circle cx="18" cy="20" r="5" fill="#12303a" stroke="#5be0d0" stroke-width="2" />
  <circle cx="18" cy="44" r="5" fill="#132a3f" stroke="#5cb8ff" stroke-width="2" stroke-opacity="0.85" />

  <!-- 输出节点：一个宝石 / 出图 -->
  <path d="M44 22.5 L54.5 32 L44 41.5 L33.5 32 Z" fill="url(#gem)" fill-opacity="0.22" stroke="url(#gem)" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M40.5 27.5 L47.5 36.5" stroke="#eafcff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.9" />
  <path d="M47.5 27.5 L40.5 36.5" stroke="#eafcff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5" />

  <!-- 右上角一点火花，表示「在跑」 -->
  <path d="M52 10 L53.4 14.6 L58 16 L53.4 17.4 L52 22 L50.6 17.4 L46 16 L50.6 14.6 Z" fill="#ffd479" fill-opacity="0.95" />
</svg>
