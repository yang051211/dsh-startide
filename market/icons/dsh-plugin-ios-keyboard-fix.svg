<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="iOS Keyboard Fix">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3b98"/>
      <stop offset="1" stop-color="#1f1f4d"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa7ff"/>
      <stop offset="1" stop-color="#6d7bf0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- keyboard base -->
  <rect x="10" y="38" width="44" height="16" rx="4" fill="#e8ecff" opacity="0.92"/>
  <!-- keys -->
  <g fill="#3b3b98">
    <rect x="14" y="42" width="5" height="4" rx="1"/>
    <rect x="21" y="42" width="5" height="4" rx="1"/>
    <rect x="28" y="42" width="5" height="4" rx="1"/>
    <rect x="35" y="42" width="5" height="4" rx="1"/>
    <rect x="42" y="42" width="5" height="4" rx="1"/>
    <rect x="19" y="48" width="26" height="3.5" rx="1.2"/>
  </g>
  <!-- composer/caret rising above the keyboard -->
  <rect x="14" y="22" width="36" height="11" rx="5.5" fill="none" stroke="url(#key)" stroke-width="2.6"/>
  <path d="M24 27.5h13" stroke="url(#key)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M43 30.5V19.5" stroke="#9aa7ff" stroke-width="3" stroke-linecap="round"/>
  <path d="M38.5 24l4.5-4.5L47.5 24" fill="none" stroke="#9aa7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>