<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Fish Mood">
  <defs>
    <linearGradient id="fm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3a6b"/>
      <stop offset="1" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="fm-fish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fd3ff"/>
      <stop offset="1" stop-color="#2f8fe0"/>
    </linearGradient>
    <!-- 情绪曲线:低平 → 涌起 → 落下,像一天的心情 -->
    <linearGradient id="fm-wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd479"/>
      <stop offset="0.55" stop-color="#ff9f7a"/>
      <stop offset="1" stop-color="#ff7fa8"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="22" fill="url(#fm-bg)"/>
  <!-- 心情的起伏 -->
  <path d="M10 56c8 0 10-13 18-13s10 25 18 25 10-30 18-30 10 20 18 20"
        fill="none" stroke="url(#fm-wave)" stroke-width="3.4" stroke-linecap="round" opacity="0.95"/>
  <!-- 她本鱼(在起伏里游) -->
  <path d="M22 76c5-9 16-14 27-13 7 1 13 4 16 8-3 4-9 7-16 8-11 1-22-4-27-13z" fill="url(#fm-fish)"/>
  <path d="M66 71l12-9v18l-12-9z" fill="#5cc0f5"/>
  <circle cx="37" cy="71" r="3.6" fill="#0d1f3c"/>
  <circle cx="38.4" cy="69.8" r="1.2" fill="#ffffff"/>
  <!-- 心里那点软(温柔/喜欢) -->
  <path d="M72 22c2.6-3.2 8-2 8 2.6 0 3.6-5 6.4-8 8.4-3-2-8-4.8-8-8.4 0-4.6 5.4-5.8 8-2.6z" fill="#ff8fb0" opacity="0.92"/>
  <!-- 一滴(难过的时候也有) -->
  <path d="M24 30c1.8-2.4 4.6-2.4 6.4 0 1.6 2.2 0.4 5.4-3.2 5.4s-4.8-3.2-3.2-5.4z" fill="#8fd8ff" opacity="0.7"/>
</svg>
