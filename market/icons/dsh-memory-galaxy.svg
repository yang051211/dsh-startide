<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6e0"/>
      <stop offset="45%" stop-color="#ffd479"/>
      <stop offset="100%" stop-color="#ffb347"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd479" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ffd479" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="13" fill="#070a12"/>

  <!-- 三条轨道 -->
  <ellipse cx="32" cy="32" rx="24" ry="10.5" fill="none" stroke="#3a4a66" stroke-width="0.9" opacity="0.55" transform="rotate(-18 32 32)"/>
  <ellipse cx="32" cy="32" rx="19.5" ry="8.5" fill="none" stroke="#3a4a66" stroke-width="0.9" opacity="0.45" transform="rotate(34 32 32)"/>
  <ellipse cx="32" cy="32" rx="15" ry="6.5" fill="none" stroke="#3a4a66" stroke-width="0.9" opacity="0.35" transform="rotate(-64 32 32)"/>

  <!-- 中心：最初那一句 -->
  <circle cx="32" cy="32" r="13" fill="url(#halo)"/>
  <circle cx="32" cy="32" r="4.6" fill="url(#sun)"/>

  <!-- 每天一颗球 -->
  <circle cx="50" cy="21" r="2.5" fill="#6aa8ff"/>
  <circle cx="13" cy="25" r="2.3" fill="#b48cff"/>
  <circle cx="45" cy="46" r="2.2" fill="#7fbf9f"/>
  <circle cx="19" cy="43" r="1.9" fill="#ff8fb1"/>
  <circle cx="32" cy="12" r="1.7" fill="#e0a35c"/>

  <!-- 虚线：连回当天的中心 -->
  <path d="M32 32 L50 21 M32 32 L13 25 M32 32 L45 46 M32 32 L19 43 M32 32 L32 12"
        stroke="#7d8aa0" stroke-width="0.8" stroke-dasharray="1.6 2.2" opacity="0.75" fill="none"/>
</svg>
