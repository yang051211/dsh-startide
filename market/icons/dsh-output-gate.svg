<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="dsh-output-gate">
  <defs>
    <linearGradient id="g" x1="14" y1="10" x2="50" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4FD1C5"/>
      <stop offset="1" stop-color="#2B6CB0"/>
    </linearGradient>
  </defs>
  <!-- 盾形底：闸门的"挡" -->
  <path d="M32 6 52 13v20c0 12.5-8.3 21.6-20 25-11.7-3.4-20-12.5-20-25V13L32 6Z"
