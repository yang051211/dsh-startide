  <!-- 门栏：三道横杠，从"放行"收窄到"拒绝" -->
  <rect x="21" y="21" width="22" height="3.6" rx="1.8" fill="url(#g)"/>
  <rect x="21" y="29.2" width="22" height="3.6" rx="1.8" fill="url(#g)" fill-opacity="0.72"/>
  <rect x="21" y="37.4" width="12" height="3.6" rx="1.8" fill="url(#g)" fill-opacity="0.42"/>
  <!-- 对勾：拦下来之后才有的"核对" -->
  <path d="M33.5 44.5 37 48l7-8.5" fill="none" stroke="url(#g)" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
