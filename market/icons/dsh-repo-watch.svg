<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Repository watchtower">
  <defs>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6f4f"/>
      <stop offset="1" stop-color="#1d4a34"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#tower)"/>
  <!-- watchtower roof -->
  <path d="M32 14 L44 24 H20 Z" fill="#e8f2ec"/>
  <!-- tower body -->
  <rect x="24" y="24" width="16" height="20" rx="2" fill="#e8f2ec"/>
  <!-- watch window -->
  <circle cx="32" cy="32" r="4.5" fill="#2f6f4f"/>
  <!-- base -->
  <rect x="18" y="44" width="28" height="5" rx="2.5" fill="#e8f2ec"/>
  <!-- the one lit dot: someone is waiting -->
  <circle cx="46" cy="18" r="4.5" fill="#f2b134"/>
</svg>
