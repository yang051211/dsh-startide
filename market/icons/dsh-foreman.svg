<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="dsh-foreman">
  <defs>
    <linearGradient id="bg" x1="10" y1="6" x2="86" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B7CFA"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- 底：圆角方块 + 渐变，和其他插件图标同尺寸、同圆角 -->
  <rect width="96" height="96" rx="24" fill="url(#bg)"/>
  <!-- 路由线：主会话把活儿分给三条支线 -->
  <g stroke="#fff" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round">
    <path d="M48 58 L48 72"/>
    <path d="M38 40 L24 30"/>
    <path d="M58 40 L72 30"/>
  </g>
  <!-- 主会话：中心节点（中间留出品牌色小孔） -->
  <circle cx="48" cy="44" r="12" fill="#fff" fill-opacity="0.96"/>
  <circle cx="48" cy="44" r="4.5" fill="#6B6BFA"/>
  <!-- 三个工作区节点 -->
  <circle cx="48" cy="78" r="7" fill="#fff" fill-opacity="0.96"/>
  <circle cx="20" cy="27" r="7" fill="#fff" fill-opacity="0.96"/>
  <circle cx="76" cy="27" r="7" fill="#fff" fill-opacity="0.96"/>
</svg>
