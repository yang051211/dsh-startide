<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Nanshan DSH npm publish assistant">
  <defs>
    <linearGradient id="np-bg" x1="18" y1="10" x2="110" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#262932"/>
      <stop offset=".46" stop-color="#0d0e12"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="np-glass" x1="30" y1="18" x2="96" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="np-rim" x1="14" y1="12" x2="114" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".58"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="np-mint" x1="52" y1="36" x2="84" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d1fae5"/>
      <stop offset=".45" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#0f9f6e"/>
    </linearGradient>
    <radialGradient id="np-spec" cx=".32" cy=".18" r=".62">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="np-violet" cx=".2" cy=".82" r=".62">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".42"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="np-cyan" cx=".82" cy=".2" r=".55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="np-blur8" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="np-blur3" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="np-clip"><rect x="8" y="8" width="112" height="112" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#np-clip)">
    <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#np-bg)"/>
    <ellipse cx="42" cy="102" rx="62" ry="40" fill="url(#np-violet)" filter="url(#np-blur8)"/>
    <ellipse cx="96" cy="32" rx="48" ry="34" fill="url(#np-cyan)" filter="url(#np-blur8)"/>
    <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#np-glass)"/>
    <ellipse cx="42" cy="26" rx="44" ry="22" fill="url(#np-spec)" filter="url(#np-blur3)"/>
    <path d="M22 42c4-18 20-30 42-32" fill="none" stroke="#ffffff" stroke-opacity=".38" stroke-width="3" stroke-linecap="round" filter="url(#np-blur3)"/>
    <path d="M18 90c12 20 34 28 58 26" fill="none" stroke="#a7f3d0" stroke-opacity=".16" stroke-width="4" stroke-linecap="round" filter="url(#np-blur3)"/>
    <ellipse cx="64" cy="100" rx="30" ry="8" fill="#000000" opacity=".35" filter="url(#np-blur8)"/>
  </g>

  <rect x="8.75" y="8.75" width="110.5" height="110.5" rx="29.25" fill="none" stroke="url(#np-rim)" stroke-width="1.5"/>

  <g stroke-linejoin="round">
    <path d="M64 34 94 49 64 64 34 49Z" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".55" stroke-width="1.4"/>
    <path d="M34 49 64 64v34L34 83Z" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".28" stroke-width="1.2"/>
    <path d="M94 49 64 64v34l30-15Z" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".22" stroke-width="1.2"/>
    <path d="M64 64v34" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.2"/>
    <path d="M40 48 64 60 88 48" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="1.2"/>
    <path d="M64 92V52" fill="none" stroke="url(#np-mint)" stroke-width="7" stroke-linecap="round"/>
    <path d="M51 64 64 51l13 13" fill="none" stroke="url(#np-mint)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M64 88V55" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="96" cy="36" r="7" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".35" stroke-width="1"/>
    <circle cx="93.8" cy="33.8" r="2.2" fill="#ffffff" fill-opacity=".6"/>
